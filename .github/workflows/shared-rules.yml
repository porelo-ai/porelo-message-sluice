# The rules and the documents - the Build workflow skips a change to documents alone, so what such a
# change needs runs here, on a GitHub runner and without the native build.
name: Shared rules check

# Once a day, not on a push: every hand-over runs the same checks locally on its exact commit first, and a run per
# push spent build minutes on what was already known. 03:17 UTC lies outside the hours the repositories are worked in.
on:
    schedule:
        - cron: '17 3 * * *'
    pull_request:
    workflow_dispatch:

# The job's token only reads the repository.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    check:
        name: Rules and documents
        # Pinned, not 'ubuntu-latest'.
        runs-on: ubuntu-26.04
        # A guess, not yet measured on a runner: a slow runner must end, not run for GitHub's six hours.
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cache the Maven repository
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.m2/repository
                  key: maven-${{ hashFiles('**/pom.xml') }}
                  restore-keys: maven-

            # As in the Build workflow: the GraalVM that compiles the tests is the one porelo-machines pins,
            # its archive checked against the pinned digest; the runner's own Java 25 only runs that step
            # and the checks.
            - name: The pinned GraalVM
              run: |
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  ./mvnw -B -q -U -N -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile="$RUNNER_TEMP/tools.classpath"
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.machines.Main jdk --github

            # The shared rules are copied byte for byte into every repository; an edited copy no longer
            # matches the hash its markers carry.
            - name: The shared rules are unchanged copies
              run: |
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig

            # An issue's file is deleted when it is finished, so nothing links to it and nothing outside
            # issues/ cites its number; every page is in the site's navigation once, and no link leaves doc/;
            # every module has a README that links its submodules.
            - name: The documents cite no issue, the site holds every page, every module says what it is
              run: |
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.release.Main check-citations .
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.release.Main check-readmes .

            # The shfmt porelo-parent pins, which Spotless does not download: validate checks the two
            # scripts in every Maven run, the documents tests' included. Checked against the digest its
            # release names.
            - name: The pinned shfmt
              run: |
                  set -eu
                  VERSION=3.12.0
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
                      "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64"
                  echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $RUNNER_TEMP/bin/shfmt" | sha256sum -c -
                  chmod +x "$RUNNER_TEMP/bin/shfmt"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            # Every test that reads a document carries the tag documents, and the guard among them fails
            # when one does not.
            - name: The tests that read documents
              run: ./mvnw -B -s settings.xml -Pdocuments test

            # A pull request's own commits held to the shared rule on commit messages. One from outside - from another
            # repository, or opened by someone not a member - also carries its author's Signed-off-by: on each commit,
            # the Developer Certificate of Origin; Dependabot's and GitHub's own commits are exempt by the author and
            # committer they record.
            - name: The pull request's commit messages
              if: github.event_name == 'pull_request'
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
              run: |
                  set -eu
                  # The checkout holds the merge commit alone; the range needs the history of both its sides.
                  if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                      git fetch --no-tags --quiet --unshallow origin "$PR_BASE" "$PR_HEAD"
                  else
                      git fetch --no-tags --quiet origin "$PR_BASE" "$PR_HEAD"
                  fi
                  outside=--outside
                  if [ "$PR_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
                      case "$PR_ASSOCIATION" in OWNER | MEMBER) outside= ;; esac
                  fi
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" org.fuin.porelo.release.Main \
                      check-commits "$PR_BASE..$PR_HEAD" $outside
