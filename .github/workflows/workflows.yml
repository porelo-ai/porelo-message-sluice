# The light check of a pull request that changes only workflows, Dependabot's action moves above all: every step pinned,
# and every workflow a file GitHub can read. It builds nothing, rents nothing, publishes nothing and holds only the token
# that reads snapshots, so the operator can merge an action move on it alone. The Build leaves such a pull request to it.
name: Workflow check

on:
    pull_request:
        branches: ['**']
        paths: ['.github/**']

permissions:
    contents: read

# As in the Build workflow: the snapshot repository Maven reads, a variable present on GitHub and the local Forgejo.
env:
    MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}

jobs:
    check:
        name: Workflow check
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # A forge with no registry or no token for it would quietly read Sonatype's snapshots alone.
            - name: A forge names its registry and its token
              env:
                  SERVER_URL: ${{ github.server_url }}
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  [ "$SERVER_URL" != 'https://github.com' ] || exit 0
                  [ -n "$MAVEN_SNAPSHOTS_URL" ] || { echo "::error::vars.MAVEN_SNAPSHOTS_URL is empty on $SERVER_URL"; exit 1; }
                  [ -n "$PORELO_PACKAGES_READ_TOKEN" ] || { echo "::error::secrets.PORELO_PACKAGES_READ_TOKEN is empty on $SERVER_URL"; exit 1; }

            # The wrapper's Maven, fetched once per pin rather than by every job with one download and no retry.
            - name: Cache the wrapper's Maven
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.m2/wrapper
                  key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

            # The wrapper checks its Maven against distributionSha256Sum and installs it only whole, so asking again
            # after a failed fetch is a safe retry; a cached one answers at once.
            - name: The wrapper's Maven
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  for attempt in 1 2 3 4 5; do
                      if ./mvnw -B -q --version > /dev/null; then
                          break
                      fi
                      if [ "$attempt" = 5 ]; then
                          echo "::error::the wrapper could not fetch its Maven in 5 attempts"
                          exit 1
                      fi
                      echo "::warning::the wrapper's Maven did not arrive (attempt $attempt); trying again"
                      sleep $((attempt * 10))
                  done

            # The Build's own check-actions, on the runner's Java 25: it reads files and fetches no JDK.
            - name: Every step pinned to a commit
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  ./mvnw -B -q -U -N -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile="$RUNNER_TEMP/tools.classpath"
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.release.Main check-actions

            # A file that does not load, or names no trigger or no job, is a workflow GitHub would not run.
            # PyYAML, where the runner's image lacks it, from the distribution's signed archive.
            - name: Every workflow loads, with its triggers and jobs
              run: |
                  if ! python3 -c 'import yaml' 2> /dev/null; then
                      sudo=
                      [ "$(id -u)" -eq 0 ] || sudo=sudo
                      $sudo apt-get update -qq
                      $sudo apt-get install -y -qq --no-install-recommends python3-yaml
                  fi
                  python3 - <<'PY'
                  import pathlib, sys, yaml
                  bad = []
                  for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
                      try:
                          loaded = yaml.safe_load(path.read_text())
                      except yaml.YAMLError as error:
                          bad.append(f"{path}: {error}")
                          continue
                      # YAML 1.1 reads the key 'on' as true.
                      triggers = loaded.get("on", loaded.get(True)) if isinstance(loaded, dict) else None
                      if not triggers or not isinstance(loaded.get("jobs"), dict) or not loaded["jobs"]:
                          bad.append(f"{path}: names no trigger or no job")
                      else:
                          print(f"OK    {path}")
                  for line in bad:
                      print(f"ERROR {line}", file=sys.stderr)
                  sys.exit(1 if bad else 0)
                  PY
