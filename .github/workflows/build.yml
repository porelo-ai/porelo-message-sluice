# Unit tests, the native executable, its packages - and on main, the packages published.
name: Build

# A push that only touches documents builds nothing; they are checked locally before every hand-over, and by the
# Shared rules check workflow once a day. A push that only touches .github/ builds nothing either: the next push
# with content builds with it. A pull request still builds on a workflow change, which is its light check.
# porelo.yml, the image a Porelo task builds this repository in, is no part of the Build either.
on:
    push:
        branches: ['**']
        # A release: v<version>, built and published to the 'releases' channel. Paths are not filtered for a tag.
        tags: ['v*']
        paths: ['**', '!**/*.md', '!doc/**', '!issues/**', '!mkdocs.yml', '!porelo.yml', '!.github/**']
    pull_request:
        branches: ['**']
        paths: ['**', '!**/*.md', '!doc/**', '!issues/**', '!mkdocs.yml', '!porelo.yml']
    workflow_dispatch:

# The job's token only reads the repository; the packages are published with the JFrog token, not with it.
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    build:
        name: Build, test and package
        # Pinned, not 'ubuntu-latest'.
        runs-on: ubuntu-24.04
        # About three times a normal run (4-5 minutes, measured): a slow runner must end,
        # not run for GitHub's six hours.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cache the Maven repository
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.m2/repository
                  key: maven-${{ hashFiles('**/pom.xml') }}
                  restore-keys: maven-

            # The GraalVM that compiles the binaries is the one porelo-machines pins, its archive checked
            # against the pinned digest before it is unpacked. The runner's own Java 25 only runs that
            # step and builds nothing that is published. -U, because a cached snapshot of porelo-machines
            # would otherwise keep an old pin for a day.
            - name: The pinned GraalVM
              run: |
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  ./mvnw -B -q -U -N -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile="$RUNNER_TEMP/tools.classpath"
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.machines.Main jdk --github

            # Every action by a commit with its exact release, no JDK fetched by a version name, Dependabot
            # watching and grouping them, and the Maven wrapper's download checked against its digest.
            - name: What the build runs is pinned
              run: |
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.release.Main check-actions

            # A release depends only on releases: every snapshot Maven resolved - dependencies, plugins and
            # their dependencies, inactive profiles included - is refused before anything is built. On a tag
            # only, since a branch may build against another repository's snapshot. With the build's own
            # profiles, which add the package modules: without them their plugins are not read.
            - name: A release depends only on releases
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  ./mvnw -B -q -s settings.xml -Pnative,dist help:effective-pom -Doutput=target/effective-pom.xml
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/tools.classpath")" \
                      org.fuin.porelo.release.Main check-releases target/effective-pom.xml \
                      --requires org.fuin.porelo:porelo-release

            # The shfmt porelo-parent pins, which Spotless does not download and validate runs on the two
            # scripts: checked against the digest its release names.
            - name: The pinned shfmt
              run: |
                  set -eu
                  VERSION=3.12.0
                  mkdir -p "$RUNNER_TEMP/bin"
                  curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
                      "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64"
                  echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  $RUNNER_TEMP/bin/shfmt" | sha256sum -c -
                  chmod +x "$RUNNER_TEMP/bin/shfmt"
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            # -s settings.xml declares the snapshot repository, and keeps a developer's own
            # ~/.m2/settings.xml out of what CI resolves. The filter ships as a native executable in
            # packages, so both are built on every push; the run number makes each snapshot's version
            # newer than the last.
            - name: Build, unit tests, native images and packages
              timeout-minutes: 12
              run: ./mvnw -B -s settings.xml -Pnative,dist verify -Dsluice.snapshot.run=${{ github.run_number }}

            # What is packaged, not the classes: every fixture must end where its name says, run from the
            # unpacked .deb and .rpm with an empty environment, so no Java can be involved. Counted on the
            # directories, never on grepped output.
            - name: Run the packaged binaries against the fixtures
              run: |
                  set -euo pipefail
                  for format in deb rpm; do
                    R="$RUNNER_TEMP/root-$format"
                    mkdir -p "$R"
                    if [ "$format" = deb ]; then
                      for p in */dist-deb/target/*.deb; do dpkg-deb -x "$p" "$R"; done
                    else
                      for p in */dist-rpm/target/*.rpm; do (cd "$R" && rpm2cpio "$GITHUB_WORKSPACE/$p" | cpio -idm); done
                    fi
                    FILTER="$R/usr/libexec/porelo/porelo-message-sluice-filter"
                    M="$RUNNER_TEMP/mail-$format"
                    mkdir -p "$M"/{incoming,sent} "$M"/filter/{accepted,feedback}
                    mkdir -m 700 "$M"/filter/{rejected,error}
                    cp filter/app/src/test/resources/fixtures/*.json "$M/incoming/"
                    set +e
                    env -i PATH=/usr/bin:/bin "$FILTER" --mail "$M" --blocking --stabilityDelayMillis 0
                    code=$?
                    set -e
                    test "$code" -eq 1
                    # A fixture's prefix says where it lands (fixtures/README.md), so the expected sets are read from
                    # the names rather than counted by hand: a new fixture cannot leave this check behind.
                    F=filter/app/src/test/resources/fixtures
                    test "$(ls "$F" | grep -c '[.]json$')" -gt 10
                    expect() { (cd "$F" && ls $1 2>/dev/null | sort); }
                    test "$(ls "$M"/filter/accepted | sort)" = "$(expect 'accept-*.json')"
                    test "$(ls "$M"/filter/rejected | sort)" = "$(expect 'detector-*.json envelope-*.json')"
                    test "$(ls "$M"/filter/error | grep -v '[.]error[.]txt$' | sort)" = "$(expect 'unprocessable-*.json')"
                    test "$(ls "$M"/filter/feedback | wc -l)" -eq "$(ls "$F" | grep -c '[.]json$')"
                    test -z "$(ls "$M"/incoming)"
                    # Signed, as Porelo sends it: the signature goes out beside its message, byte for byte;
                    # one in the namespace before the rename is refused. Each in its own mailbox run, so the
                    # fixtures' counts above stay as they are.
                    G=filter/app/src/test/resources/signatures
                    S="$RUNNER_TEMP/signed-$format"
                    mkdir -p "$S"/{incoming,sent} "$S"/filter/{accepted,feedback}
                    mkdir -m 700 "$S"/filter/{rejected,error}
                    cp "$F/accept-clean-prose.json" "$S/incoming/new.json"
                    cp "$G/porelo-ed25519.sig" "$S/incoming/new.json.sig"
                    cp "$F/accept-clean-prose.json" "$S/incoming/old.json"
                    cp "$G/old-namespace-ed25519.sig" "$S/incoming/old.json.sig"
                    set +e
                    env -i PATH=/usr/bin:/bin "$FILTER" --mail "$S" --blocking --stabilityDelayMillis 0
                    set -e
                    test "$(ls "$S"/filter/accepted | sort | tr '\n' ' ')" = "new.json new.json.sig "
                    cmp "$S/filter/accepted/new.json.sig" "$G/porelo-ed25519.sig"
                    ls "$S"/filter/error | grep -qx 'old.json'
                    grep -rlF 'UNPROCESSABLE/SIGNATURE_UNUSABLE' "$S"/filter/feedback | grep -q .
                    test -z "$(ls "$S"/incoming)"
                  done

            # Only main and a release tag publish. A tag publishes a release, everything else a snapshot; a release
            # is refused unless the tag is exactly 'v' plus the version it carries, and a version is never a release
            # and a snapshot at once.
            - name: Which channel
              id: channel
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "  $VERSION -> $(tail -1 "$GITHUB_OUTPUT")"

            # Into the channel this run publishes to, over Artifactory's REST interface with curl alone, so no
            # downloaded tool runs beside the token. The token reaches curl on standard input, once per call, from the
            # shell's own printf: never a file, never a command line. Both checksums travel with each file, and Artifactory refuses bytes that do not match.
            # The deb's properties are what put it into the index; without them it is stored and never listed, and
            # nothing says so. A release that is already there is refused: a published release is never replaced.
            - name: Publish the packages
              timeout-minutes: 5
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  base="${JF_URL%/}/artifactory"
                  if [ "$CHANNEL" = releases ]; then
                    # Fetched to a file, so an index that cannot be read stops the release rather than reading as
                    # "not published".
                    curl -sfL -o "$RUNNER_TEMP/published-index" "$base/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                        || { echo "::error::the release index could not be read, so whether this release is published is unknown"; exit 1; }
                    for p in */dist-deb/target/*.deb; do
                      name="$(dpkg-deb -f "$p" Package)"
                      if grep -qxF "Filename: pool/main/p/$name/$(basename "$p")" "$RUNNER_TEMP/published-index"; then
                        echo "::error::$(basename "$p") is published already"; exit 1
                      fi
                    done
                  fi
                  [ -n "$JF_ACCESS_TOKEN" ] || { echo "::error::secret JF_ACCESS_TOKEN is not set"; exit 1; }
                  put() {
                    printf 'header = "Authorization: Bearer %s"\n' "$JF_ACCESS_TOKEN" \
                      | curl -fsS -K - -o /dev/null -T "$1" \
                        -H "X-Checksum-Sha1: $(sha1sum "$1" | cut -d' ' -f1)" \
                        -H "X-Checksum-Sha256: $(sha256sum "$1" | cut -d' ' -f1)" \
                        "$base/$2$(basename "$1")${3:+;$3}"
                    echo "  put   $2$(basename "$1")"
                  }
                  for p in */dist-deb/target/*.deb; do
                    name="$(dpkg-deb -f "$p" Package)"
                    put "$p" "porelo-dist-deb/pool/main/p/$name/" "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  done
                  for p in */dist-rpm/target/*.rpm; do
                    put "$p" "porelo-dist-rpm/${CHANNEL}/"
                  done

            # Indexing is asynchronous and fails silently, so the index is read back - anonymously, as an
            # installer sees it, following Artifactory's redirect - and must name the very file just
            # uploaded, not merely the package: yesterday's build in the index would pass that.
            - name: The packages are indexed, not merely stored
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  base="${JF_URL%/}/artifactory"
                  indexed() {
                    local packages primary
                    packages="$(curl -sfL "$base/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" || true)"
                    for p in */dist-deb/target/*.deb; do
                      name="$(dpkg-deb -f "$p" Package)"
                      grep -qxF "Filename: pool/main/p/$name/$(basename "$p")" <<< "$packages" || return 1
                    done
                    primary="$(curl -sfL "$base/porelo-dist-rpm/${CHANNEL}/repodata/repomd.xml" \
                        | sed -n 's/.*<location href="\([^"]*primary.xml.gz\)".*/\1/p' | head -1)"
                    [ -n "$primary" ] || return 1
                    primary="$(curl -sfL "$base/porelo-dist-rpm/${CHANNEL}/$primary" | gunzip || true)"
                    for p in */dist-rpm/target/*.rpm; do
                      grep -qF "$(basename "$p")" <<< "$primary" || return 1
                    done
                  }
                  for attempt in $(seq 1 20); do
                    if indexed; then
                      echo "all packages indexed"
                      exit 0
                    fi
                    sleep 6
                  done
                  echo "uploaded but not indexed after two minutes" >&2
                  exit 1
